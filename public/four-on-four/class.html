<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 על ארבע — כיתה</title>
<style>
:root{--bg:#f5f1e9;--panel:#fffdf8;--ink:#244f63;--muted:#7f8a8f;--line:#ddd5ca;--teal:#2f8999;--shadow:0 12px 28px rgba(52,67,73,.10)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf7f0,var(--bg))}
button{font:inherit;cursor:pointer}.app{max-width:980px;margin:auto;padding:14px 14px 32px}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px 12px;background:rgba(250,247,240,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,213,202,.7)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#35677d,#244d61);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:950;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:24px}.brand small{display:block;color:var(--muted);margin-top:2px}
.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-top:14px}
.hero{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center}.codebox{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fffdfa;text-align:center}
.code{font-size:42px;font-weight:950;letter-spacing:.08em;direction:ltr}.sub{color:var(--muted);font-size:13px}
.qrbox{min-height:210px;border-radius:18px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);padding:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:0;border-radius:14px;padding:12px 13px;font-weight:900}.primary{background:#2d7e90;color:#fff}.soft{background:#edf2f1;color:var(--ink);border:1px solid var(--line)}
.board-wrap{background:#fffdfa;border:1px solid var(--line);border-radius:22px;padding:14px}.board-title{text-align:center;margin-bottom:12px}.board-title h2{margin:0;font-size:22px}.board-title div{color:var(--muted);margin-top:3px}
.board{display:grid;gap:8px;direction:ltr}.tile{--tile-color:#dce9f3;position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--tile-color) 96%,#fff 4%),color-mix(in srgb,var(--tile-color) 98%,#b9c8cf 2%));border:1px solid rgba(69,91,103,.22);box-shadow:0 8px 16px rgba(42,58,66,.12),0 2px 5px rgba(42,58,66,.08),inset 0 1px 0 rgba(255,255,255,.84)}
.tile.t0{--tile-color:#dce9f3}.tile.t1{--tile-color:#e4efe5}.tile.t2{--tile-color:#f1e4de}.tile.t3{--tile-color:#e8e7f2}.tile.t4{--tile-color:#efe8d8}
.tile:before,.tile:after{content:"";position:absolute;left:50%;top:50%;background:rgba(55,82,95,.24);z-index:1}.tile:before{width:88%;height:1.4px;transform:translate(-50%,-50%)}.tile:after{width:1.4px;height:88%;transform:translate(-50%,-50%)}
.word{position:absolute;width:38%;height:36%;display:flex;align-items:center;justify-content:center;text-align:center;color:#274e61;font-weight:850;line-height:1.04;font-size:clamp(8px,1.45vw,14px);padding:3px;overflow:hidden;direction:rtl;z-index:2}.tl{left:5%;top:5%}.tr{right:5%;top:5%}.bl{left:5%;bottom:5%}.br{right:5%;bottom:5%}
.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#2b4655,#1c313d);color:#fff8eb;display:grid;place-items:center;font-weight:900;z-index:3;font-size:20px;box-shadow:0 4px 9px rgba(28,45,55,.22)}
.note{margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:720px){.hero{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.code{font-size:36px}.app{padding:10px}.card{padding:13px}.board-wrap{padding:10px}}

.live-card{margin-top:14px}
.live-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.live-head h2{margin:0;font-size:20px}
.live-status{font-size:13px;color:var(--muted)}
.player-list{display:flex;flex-wrap:wrap;gap:8px;min-height:42px}
.player-chip{background:#eef5f4;border:1px solid #dce8e5;border-radius:999px;padding:8px 12px;font-weight:800}
.empty-players{color:var(--muted);font-size:14px;padding:8px 0}
.start-class-btn{width:100%;margin-top:13px;min-height:54px;border:0;border-radius:16px;background:linear-gradient(145deg,#75a96f,#5c9160);color:#fff;font-weight:950;font-size:18px;box-shadow:0 10px 20px rgba(80,125,84,.18)}
.start-class-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo" id="sizeBadge">4×4</div><div><h1 id="activityTitle">ארבע על ארבע</h1><small id="activityMeta"></small></div></div>
  <button class="btn soft" onclick="history.back()">חזרה לעריכה</button>
</header>

<section class="card">
  <div class="hero">
    <div>
      <div class="codebox">
        <div class="sub">קוד כניסה לכיתה</div>
        <div class="code" id="classCode">------</div>
      </div>
      <div class="actions">
        <button class="btn primary" id="copyStudent">העתק קישור לתלמיד</button>
        <button class="btn soft" id="openStudent">פתח כתלמיד</button>
      </div>
      <div class="note">הקישור עצמו אינו מוצג במסך. אפשר להעתיק אותו או לפתוח אותו כתלמיד.</div>
    </div>
    <div class="qrbox"><div id="qr"></div></div>
  </div>
</section>

<section class="card live-card">
  <div class="live-head">
    <h2>תלמידים שהצטרפו</h2>
    <div class="live-status" id="liveStatus">ממתינים לתלמידים…</div>
  </div>
  <div class="player-list" id="playerList"><div class="empty-players">עדיין לא הצטרפו תלמידים.</div></div>
  <button class="start-class-btn" id="startClassBtn">פתח את המשחק לתלמידים</button>
</section>

<section class="card board-wrap">
  <div class="board-title"><h2 id="topicTitle"></h2><div id="classTitle"></div></div>
  <div class="board" id="board"></div>
</section>
</div>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onload="window.dispatchEvent(new Event('qr-ready'))"></script>
<script>
const SB_URL="https://zydhfhfhspflvhlpmokj.supabase.co";
const SB_KEY="sb_publishable_DJN48TNChvPce3MZ7bDaiw_5Q8Eam6x";
const qs=new URLSearchParams(location.search);
const SESSION_ID=qs.get("session");
const HOST_TOKEN=qs.get("host")||sessionStorage.getItem("fourOnFourHostToken")||"";
let game=null;
let rosterTimer=null;

async function sb(path,options={}){
  const headers={
    apikey:SB_KEY,
    Authorization:"Bearer "+SB_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };
  return fetch(SB_URL+path,{...options,headers});
}
async function loadSession(){
  if(!SESSION_ID)return null;
  const res=await sb("/rest/v1/four_on_four_sessions?id=eq."+encodeURIComponent(SESSION_ID)+"&select=id,code,activity_name,subject,class_name,topic,board_size,groups,status,started_at");
  const rows=await res.json();
  return res.ok&&rows?.[0]?rows[0]:null;
}
function studentUrl(){
  const u=new URL(location.href);
  const p=u.pathname.split("/");p[p.length-1]="student.html";u.pathname=p.join("/");
  u.search="?session="+encodeURIComponent(SESSION_ID);
  u.hash="";
  return u.toString();
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok;
}
async function loadPlayers(){
  if(!SESSION_ID)return [];
  const res=await sb("/rest/v1/four_on_four_players?session_id=eq."+encodeURIComponent(SESSION_ID)+"&select=id,name,joined_at&order=joined_at.asc");
  const rows=await res.json();
  return res.ok&&Array.isArray(rows)?rows:[];
}
function renderPlayers(players){
  const list=document.getElementById("playerList");
  const status=document.getElementById("liveStatus");
  if(!players.length){
    list.innerHTML='<div class="empty-players">עדיין לא הצטרפו תלמידים.</div>';
    status.textContent="ממתינים לתלמידים…";
    return;
  }
  list.innerHTML=players.map(p=>'<div class="player-chip">'+escapeHtml(p.name)+'</div>').join("");
  status.textContent=players.length===1?"תלמיד אחד הצטרף":players.length+" תלמידים הצטרפו";
}
function escapeHtml(v){
  const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML;
}
async function refreshLive(){
  const [players,session]=await Promise.all([loadPlayers(),loadSession()]);
  renderPlayers(players);
  if(session){
    game=session;
    const btn=document.getElementById("startClassBtn");
    if(session.status==="running"){
      btn.textContent="המשחק פתוח ✓";
      btn.disabled=true;
      document.getElementById("liveStatus").textContent=(players.length?document.getElementById("liveStatus").textContent+" · ":"")+"המשחק התחיל";
    }else if(session.status==="finished"){
      btn.textContent="המשחק הסתיים";
      btn.disabled=true;
    }
  }
}
function renderBoard(){
  const N=Number(game.board_size)||3,groups=(game.groups||[]).slice(0,N*N);
  const tiles=Array.from({length:N*N},(_,i)=>({theme:i%5,c:{tl:"",tr:"",bl:"",br:""}}));
  let g=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const it=groups[g++]||["","","",""];
    const top=(r-1+N)%N,left=(c-1+N)%N;
    tiles[top*N+left].c.br=it[0]||"";
    tiles[top*N+c].c.bl=it[1]||"";
    tiles[r*N+left].c.tr=it[2]||"";
    tiles[r*N+c].c.tl=it[3]||"";
  }
  const board=document.getElementById("board");
  board.style.gridTemplateColumns="repeat("+N+",1fr)";
  board.innerHTML=tiles.map(t=>'<div class="tile t'+t.theme+'"><div class="word tl">'+escapeHtml(t.c.tl)+'</div><div class="word tr">'+escapeHtml(t.c.tr)+'</div><div class="word bl">'+escapeHtml(t.c.bl)+'</div><div class="word br">'+escapeHtml(t.c.br)+'</div><div class="plus">+</div></div>').join("");
}
function drawQr(){
  const q=document.getElementById("qr");q.innerHTML="";
  if(window.QRCode)new QRCode(q,{text:studentUrl(),width:190,height:190,colorDark:"#234f63",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
async function boot(){
  game=await loadSession();
  if(!game){
    document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:system-ui">לא נמצאה הכיתה. חזור למסך יצירת המשחק ופתח כיתה מחדש.</div>';
    return;
  }
  document.getElementById("activityTitle").textContent=game.activity_name||"ארבע על ארבע";
  document.getElementById("activityMeta").textContent=[game.subject,game.class_name].filter(Boolean).join(" · ");
  document.getElementById("topicTitle").textContent=game.topic?("נושא הפעילות: "+game.topic):(game.activity_name||"");
  document.getElementById("classTitle").textContent=game.class_name?("כיתה: "+game.class_name):"";
  document.getElementById("classCode").textContent=game.code||"------";
  document.getElementById("sizeBadge").textContent=(game.board_size||3)+"×"+(game.board_size||3);
  renderBoard();
  drawQr();
  await refreshLive();
  rosterTimer=setInterval(refreshLive,1000);
}
document.getElementById("copyStudent").onclick=async()=>{
  const b=document.getElementById("copyStudent"),ok=await copyText(studentUrl());
  b.textContent=ok?"הקישור הועתק ✓":"לא ניתן להעתיק";
  setTimeout(()=>b.textContent="העתק קישור לתלמיד",1300);
};
document.getElementById("openStudent").onclick=()=>window.open(studentUrl(),"_blank");
document.getElementById("startClassBtn").onclick=async()=>{
  const btn=document.getElementById("startClassBtn");
  if(!SESSION_ID||!HOST_TOKEN)return;
  btn.disabled=true;btn.textContent="פותח את המשחק…";
  try{
    const res=await sb("/rest/v1/rpc/four_on_four_start_session",{
      method:"POST",
      body:JSON.stringify({p_session_id:SESSION_ID,p_host_token:HOST_TOKEN})
    });
    const ok=await res.json();
    if(!res.ok||ok!==true)throw new Error("start");
    btn.textContent="המשחק פתוח ✓";
    document.getElementById("liveStatus").textContent="המשחק התחיל";
    await refreshLive();
  }catch(e){
    btn.disabled=false;btn.textContent="פתח את המשחק לתלמידים";
    alert("לא הצלחנו לפתוח את המשחק. נסה שוב.");
  }
};
window.addEventListener("qr-ready",drawQr);
boot();
</script>
</body>
</html>
